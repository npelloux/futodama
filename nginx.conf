server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  # Le moteur doit toujours être revalidé avec la page : un vieux moteur.js casserait la nouvelle page.
  location = /moteur.js { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ =404; }
}
